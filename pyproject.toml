[project]
name = "nvvp-vergoeding-scraper"
version = "0.2.0"
description = "Scrape vergoedingen van NvvP website"
authors = [
    {name = "Dennis Bakhuis", email = "pypi@bakhuis.nu"}
]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jupyterlab>=4.5.1",
    "selenium>=4.39.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.0",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "selenium.*",
    "bs4.*",
]
ignore_missing_imports = true
